name: CI

# À chaque push et pull request : vérification des types, tests, build de l'interface
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        # Pas de GPU sur GitHub Actions : on saute la version CUDA d'onnxruntime
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Vérifier les types (serveur + interface)
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de l'interface
        run: npm run build
